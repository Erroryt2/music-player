<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Manage Songs</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <div class="bg"></div>
    <div class="glow"></div>


    <main class="manage-music-card">

        <div class="manage-header">

            <h1>
                Manage Songs
            </h1>

            <p>
                Admin can manage added music
            </p>

        </div>


        <div
            id="manageSongList"
            class="manage-song-list"
        >

            <div class="loading-songs">
                Checking admin access...
            </div>

        </div>


        <a
            href="add-song.html"
            class="manage-add-btn"
            id="addSongLink"
            style="display:none;"
        >
            ＋ Add New Song
        </a>


        <button
            id="logoutAdminBtn"
            type="button"
            style="
                display:none;
                width:100%;
                margin-top:15px;
                padding:12px;
                border:1px solid #4a3540;
                border-radius:10px;
                background:#241820;
                color:white;
                cursor:pointer;
                font-weight:bold;
            "
        >
            🚪 Logout Admin
        </button>


        <a
            href="index.html"
            class="manage-back-btn"
        >
            ← Back to Music
        </a>

    </main>


    <!-- SUPABASE -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <script>

        /* =====================================================
           SUPABASE CONFIG
        ===================================================== */

        const SUPABASE_URL =
            "https://wbrvmfolvmivdavhwqza.supabase.co";


        const SUPABASE_PUBLISHABLE_KEY =
            "sb_publishable_WImqKauLjX2vvkrSOnoe_Q_UjiCosQk";


        /*
           IMPORTANT:
           sessionStorage means the Admin session is kept
           during the current browser tab/session.

           When the browser session ends, Admin will need
           to login again.
        */

        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_PUBLISHABLE_KEY,
                {
                    auth: {
                        storage:
                            window.sessionStorage,

                        persistSession:
                            true,

                        autoRefreshToken:
                            true,

                        detectSessionInUrl:
                            true
                    }
                }
            );


        /* =====================================================
           ELEMENTS
        ===================================================== */

        const songList =
            document.getElementById(
                "manageSongList"
            );


        const addSongLink =
            document.getElementById(
                "addSongLink"
            );


        const logoutAdminBtn =
            document.getElementById(
                "logoutAdminBtn"
            );


        /* =====================================================
           CHECK ADMIN
        ===================================================== */

        async function checkAdmin() {

            try {

                const {
                    data: {
                        session
                    },
                    error: sessionError
                } =
                    await supabaseClient
                        .auth
                        .getSession();


                if (sessionError) {

                    throw sessionError;

                }


                /* =========================
                   NOT LOGGED IN
                ========================= */

                if (!session) {

                    showAccessDenied(
                        "Please login as Admin."
                    );

                    return false;

                }


                /* =========================
                   ADMIN CHECK
                ========================= */

                const {
                    data,
                    error
                } =
                    await supabaseClient
                        .rpc(
                            "is_admin"
                        );


                if (error) {

                    throw error;

                }


                if (!data) {

                    await supabaseClient
                        .auth
                        .signOut();


                    showAccessDenied(
                        "Only Admin can manage songs."
                    );


                    return false;

                }


                /* =========================
                   ADMIN VERIFIED
                ========================= */

                addSongLink.style.display =
                    "block";


                logoutAdminBtn.style.display =
                    "block";


                return true;


            } catch (error) {

                console.error(
                    "Admin check error:",
                    error
                );


                showAccessDenied(
                    "Admin verification failed."
                );


                return false;

            }

        }


        /* =====================================================
           LOAD SONGS FROM SUPABASE
        ===================================================== */

        async function loadSongs() {

            songList.innerHTML = `
                <div class="loading-songs">
                    Loading songs...
                </div>
            `;


            const {
                data: songs,
                error
            } =
                await supabaseClient
                    .from("songs")
                    .select(
                        "id,title,artist,audio_url,cover_url,created_at"
                    )
                    .order(
                        "created_at",
                        {
                            ascending:
                                false
                        }
                    );


            if (error) {

                console.error(
                    "Load songs error:",
                    error
                );


                songList.innerHTML = `
                    <div class="empty-songs">
                        Unable to load songs.
                        <br><br>
                        ${escapeHTML(
                            error.message
                        )}
                    </div>
                `;

                return;

            }


            if (
                !songs ||
                songs.length === 0
            ) {

                showEmpty();

                return;

            }


            songList.innerHTML =
                "";


            songs.forEach(
                function(song) {

                    createSongItem(
                        song
                    );

                }
            );

        }


        /* =====================================================
           CREATE SONG ITEM
        ===================================================== */

        function createSongItem(
            song
        ) {

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "manage-song-item";


            const coverURL =
                song.cover_url ||
                "https://placehold.co/80x80/222222/ffffff?text=Music";


            item.innerHTML = `

                <img
                    class="manage-song-cover"
                    src="${escapeHTML(
                        coverURL
                    )}"
                    alt=""
                >


                <div
                    class="manage-song-info"
                >

                    <strong>
                        ${escapeHTML(
                            song.title
                        )}
                    </strong>


                    <small>
                        ${escapeHTML(
                            song.artist
                        )}
                    </small>

                </div>


                <button
                    class="remove-song-btn"
                    type="button"
                >
                    🗑 Remove
                </button>

            `;


            const removeBtn =
                item.querySelector(
                    ".remove-song-btn"
                );


            removeBtn.addEventListener(
                "click",
                function() {

                    removeSong(
                        song,
                        item,
                        removeBtn
                    );

                }
            );


            songList.appendChild(
                item
            );

        }


        /* =====================================================
           REMOVE SONG
        ===================================================== */

        async function removeSong(
            song,
            item,
            removeBtn
        ) {

            const confirmDelete =
                confirm(
                    `Delete "${song.title}" permanently?`
                );


            if (!confirmDelete) {

                return;

            }


            try {

                removeBtn.disabled =
                    true;


                removeBtn.textContent =
                    "Removing...";


                /* =========================
                   DOUBLE ADMIN CHECK
                ========================= */

                const {
                    data: adminCheck,
                    error: adminError
                } =
                    await supabaseClient
                        .rpc(
                            "is_admin"
                        );


                if (adminError) {

                    throw adminError;

                }


                if (!adminCheck) {

                    throw new Error(
                        "Admin access required."
                    );

                }


                /* =========================
                   DELETE AUDIO FILE
                ========================= */

                if (
                    song.audio_url
                ) {

                    const audioPath =
                        getStoragePath(
                            song.audio_url
                        );


                    if (audioPath) {

                        const {
                            error:
                                audioDeleteError
                        } =
                            await supabaseClient
                                .storage
                                .from("music")
                                .remove([
                                    audioPath
                                ]);


                        if (
                            audioDeleteError
                        ) {

                            console.warn(
                                "Audio delete warning:",
                                audioDeleteError
                            );

                        }

                    }

                }


                /* =========================
                   DELETE COVER FILE
                ========================= */

                if (
                    song.cover_url
                ) {

                    const coverPath =
                        getStoragePath(
                            song.cover_url
                        );


                    if (coverPath) {

                        const {
                            error:
                                coverDeleteError
                        } =
                            await supabaseClient
                                .storage
                                .from("music")
                                .remove([
                                    coverPath
                                ]);


                        if (
                            coverDeleteError
                        ) {

                            console.warn(
                                "Cover delete warning:",
                                coverDeleteError
                            );

                        }

                    }

                }


                /* =========================
                   DELETE DATABASE ROW
                ========================= */

                const {
                    error:
                        databaseError
                } =
                    await supabaseClient
                        .from("songs")
                        .delete()
                        .eq(
                            "id",
                            song.id
                        );


                if (
                    databaseError
                ) {

                    throw databaseError;

                }


                /* =========================
                   REMOVE FROM SCREEN
                ========================= */

                item.remove();


                if (
                    songList.children
                        .length === 0
                ) {

                    showEmpty();

                }


                alert(
                    "✓ Song removed successfully."
                );


            } catch (error) {

                console.error(
                    "Remove song error:",
                    error
                );


                alert(
                    "Song remove করা যায়নি:\n" +
                    error.message
                );


                removeBtn.disabled =
                    false;


                removeBtn.textContent =
                    "🗑 Remove";

            }

        }


        /* =====================================================
           STORAGE PATH
        ===================================================== */

        function getStoragePath(
            url
        ) {

            try {

                const marker =
                    "/storage/v1/object/public/music/";


                const index =
                    url.indexOf(
                        marker
                    );


                if (
                    index === -1
                ) {

                    return null;

                }


                return decodeURIComponent(
                    url.substring(
                        index +
                        marker.length
                    )
                );


            } catch (error) {

                console.error(
                    "Storage path error:",
                    error
                );


                return null;

            }

        }


        /* =====================================================
           ACCESS DENIED
        ===================================================== */

        function showAccessDenied(
            text
        ) {

            addSongLink.style.display =
                "none";


            logoutAdminBtn.style.display =
                "none";


            songList.innerHTML = `

                <div
                    class="empty-songs"
                >

                    <div
                        class="empty-icon"
                        style="
                            font-size:45px;
                        "
                    >
                        🔒
                    </div>


                    <p>
                        Access Denied
                    </p>


                    <small>
                        ${escapeHTML(
                            text
                        )}
                    </small>


                    <br><br>


                    <a
                        href="add-song.html"
                        style="
                            color:white;
                            text-decoration:none;
                        "
                    >
                        🔐 Go to Admin Login
                    </a>

                </div>

            `;

        }


        /* =====================================================
           EMPTY
        ===================================================== */

        function showEmpty() {

            songList.innerHTML = `

                <div
                    class="empty-songs"
                >

                    <div
                        class="empty-icon"
                    >
                        🎵
                    </div>


                    <p>
                        No songs added
                    </p>


                    <small>
                        Add songs from Add Music
                    </small>

                </div>

            `;

        }


        /* =====================================================
           ESCAPE HTML
        ===================================================== */

        function escapeHTML(
            text
        ) {

            const div =
                document.createElement(
                    "div"
                );


            div.textContent =
                text || "";


            return div.innerHTML;

        }


        /* =====================================================
           LOGOUT
        ===================================================== */

        logoutAdminBtn.addEventListener(
            "click",
            async function() {

                const confirmLogout =
                    confirm(
                        "Admin logout করতে চান?"
                    );


                if (
                    !confirmLogout
                ) {

                    return;

                }


                const {
                    error
                } =
                    await supabaseClient
                        .auth
                        .signOut();


                if (error) {

                    alert(
                        "Logout failed: " +
                        error.message
                    );

                    return;

                }


                window.location.href =
                    "add-song.html";

            }
        );


        /* =====================================================
           START
        ===================================================== */

        async function start() {

            const admin =
                await checkAdmin();


            if (!admin) {

                return;

            }


            await loadSongs();

        }


        start();

    </script>

</body>

</html>
