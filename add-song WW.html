<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Add Song</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                #0b0b0d;

            color: white;

            font-family:
                Arial,
                sans-serif;

            padding: 20px;
        }


        .add-card {

            width: 100%;
            max-width: 480px;

            padding: 28px;

            border-radius: 24px;

            background:
                rgba(25,25,28,0.95);

            border:
                1px solid
                rgba(255,255,255,0.08);

            box-shadow:
                0 25px 70px
                rgba(0,0,0,0.55);
        }


        h1 {

            margin:
                0 0 7px;

            text-align: center;

            font-size: 25px;
        }


        .subtitle {

            margin:
                0 0 25px;

            text-align: center;

            color: #777;

            font-size: 13px;
        }


        label {

            display: block;

            margin:
                16px 0 7px;

            color: #aaa;

            font-size: 12px;
        }


        input[type="text"],
        input[type="file"] {

            width: 100%;

            padding: 12px;

            border-radius: 11px;

            border:
                1px solid
                rgba(255,255,255,0.08);

            background:
                rgba(255,255,255,0.05);

            color: white;

            outline: none;
        }


        input[type="file"] {

            cursor: pointer;
        }


        input:focus {

            border-color:
                rgba(255,255,255,0.25);
        }


        .preview {

            width: 100px;
            height: 100px;

            margin:
                18px auto;

            border-radius: 15px;

            object-fit: cover;

            display: none;

            background:
                #222;
        }


        .add-btn {

            width: 100%;

            margin-top: 24px;

            padding: 13px;

            border: 0;

            border-radius: 12px;

            background: white;

            color: #111;

            font-size: 14px;

            font-weight: 600;

            cursor: pointer;
        }


        .add-btn:hover {

            transform:
                translateY(-1px);

            background:
                #eeeeee;
        }


        .back-btn {

            display: block;

            margin-top: 16px;

            text-align: center;

            color: #777;

            text-decoration: none;

            font-size: 12px;
        }


        .back-btn:hover {

            color: white;
        }


        .message {

            display: none;

            margin-top: 15px;

            padding: 10px;

            border-radius: 10px;

            text-align: center;

            font-size: 12px;
        }


        .success {

            display: block;

            background:
                rgba(70,200,120,0.10);

            color: #78df9d;
        }


        .error {

            display: block;

            background:
                rgba(255,70,70,0.10);

            color: #ff8888;
        }

    </style>

</head>


<body>


    <div class="add-card">

        <h1>
            Add Song
        </h1>

        <p class="subtitle">
            Add music to your playlist
        </p>


        <label>
            Song Title
        </label>

        <input
            type="text"
            id="songTitleInput"
            placeholder="Enter song name"
        >


        <label>
            Artist
        </label>

        <input
            type="text"
            id="artistInput"
            placeholder="Enter artist name"
        >


        <label>
            Audio File
        </label>

        <input
            type="file"
            id="audioInput"
            accept="audio/*"
        >


        <label>
            Cover Image
        </label>

        <input
            type="file"
            id="coverInput"
            accept="image/*"
        >


        <img
            id="coverPreview"
            class="preview"
            alt="Cover Preview"
        >


        <button
            id="addSongBtn"
            class="add-btn"
        >
            ＋ Add Song
        </button>


        <div
            id="message"
            class="message"
        ></div>


        <a
            href="index.html"
            class="back-btn"
        >
            ← Back to Music
        </a>

    </div>


<script>

/* =========================
   ELEMENTS
========================= */

const titleInput =
    document.getElementById(
        "songTitleInput"
    );

const artistInput =
    document.getElementById(
        "artistInput"
    );

const audioInput =
    document.getElementById(
        "audioInput"
    );

const coverInput =
    document.getElementById(
        "coverInput"
    );

const coverPreview =
    document.getElementById(
        "coverPreview"
    );

const addSongBtn =
    document.getElementById(
        "addSongBtn"
    );

const message =
    document.getElementById(
        "message"
    );


/* =========================
   COVER PREVIEW
========================= */

coverInput.addEventListener(
    "change",
    () => {

        const file =
            coverInput.files[0];

        if (!file) {

            coverPreview.style.display =
                "none";

            return;
        }


        const reader =
            new FileReader();


        reader.onload =
            function(event) {

                coverPreview.src =
                    event.target.result;

                coverPreview.style.display =
                    "block";

            };


        reader.readAsDataURL(file);

    }
);


/* =========================
   SHOW MESSAGE
========================= */

function showMessage(
    text,
    type
) {

    message.textContent =
        text;

    message.className =
        "message " + type;

}


/* =========================
   ADD SONG
========================= */

addSongBtn.addEventListener(
    "click",
    async () => {

        const title =
            titleInput.value.trim();

        const artist =
            artistInput.value.trim();

        const audioFile =
            audioInput.files[0];

        const coverFile =
            coverInput.files[0];


        /* Required */

        if (!title) {

            showMessage(
                "Song title দিন।",
                "error"
            );

            return;
        }


        if (!artist) {

            showMessage(
                "Artist name দিন।",
                "error"
            );

            return;
        }


        if (!audioFile) {

            showMessage(
                "Audio file select করুন।",
                "error"
            );

            return;
        }


        /* Button lock */

        addSongBtn.disabled =
            true;

        addSongBtn.textContent =
            "Adding...";


        try {

            /* Audio → Data URL */

            const audioData =
                await fileToDataURL(
                    audioFile
                );


            /* Cover → Data URL */

            let coverData = "";

            if (coverFile) {

                coverData =
                    await fileToDataURL(
                        coverFile
                    );

            }


            /* Existing songs */

            let userSongs = [];


            try {

                userSongs =
                    JSON.parse(
                        localStorage.getItem(
                            "userSongs"
                        ) || "[]"
                    );

            } catch (error) {

                userSongs = [];

            }


            /* New song */

            const newSong = {

                id:
                    Date.now().toString(),

                title:
                    title,

                artist:
                    artist,

                cover:
                    coverData,

                audio:
                    audioData

            };


            /* ADD */

            userSongs.push(
                newSong
            );


            /* SAVE */

            localStorage.setItem(
                "userSongs",
                JSON.stringify(
                    userSongs
                )
            );


            console.log(
                "Song saved:",
                newSong
            );


            showMessage(
                "✓ Song successfully added!",
                "success"
            );


            /* Reset */

            titleInput.value =
                "";

            artistInput.value =
                "";

            audioInput.value =
                "";

            coverInput.value =
                "";

            coverPreview.style.display =
                "none";


            /*
             * একটু delay দিয়ে
             * Player-এ ফিরে যাবে
             */

            setTimeout(
                () => {

                    window.location.href =
                        "index.html";

                },
                900
            );

        } catch (error) {

            console.error(
                error
            );


            showMessage(
                "Song add করা যায়নি। আবার চেষ্টা করুন।",
                "error"
            );

        }


        addSongBtn.disabled =
            false;

        addSongBtn.textContent =
            "＋ Add Song";

    }
);


/* =========================
   FILE → DATA URL
========================= */

function fileToDataURL(
    file
) {

    return new Promise(
        (
            resolve,
            reject
        ) => {

            const reader =
                new FileReader();


            reader.onload =
                () => {

                    resolve(
                        reader.result
                    );

                };


            reader.onerror =
                () => {

                    reject(
                        new Error(
                            "File read failed"
                        )
                    );

                };


            reader.readAsDataURL(
                file
            );

        }
    );

}

</script>


</body>

</html>
