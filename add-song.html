<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Song</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0b0b0d;color:white;font-family:Arial,sans-serif;padding:20px}
.add-card{width:100%;max-width:480px;padding:28px;border-radius:24px;background:rgba(25,25,28,.95);border:1px solid rgba(255,255,255,.08);box-shadow:0 25px 70px rgba(0,0,0,.55)}
h1{margin:0 0 7px;text-align:center;font-size:25px}
.subtitle{margin:0 0 25px;text-align:center;color:#777;font-size:13px}
label{display:block;margin:16px 0 7px;color:#aaa;font-size:12px}
input[type=text],input[type=file]{width:100%;padding:12px;border-radius:11px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.05);color:white;outline:none}
input[type=file]{cursor:pointer}
.preview{width:100px;height:100px;margin:18px auto;border-radius:15px;object-fit:cover;display:none;background:#222}
.add-btn{width:100%;margin-top:24px;padding:13px;border:0;border-radius:12px;background:white;color:#111;font-size:14px;font-weight:600;cursor:pointer}
.add-btn:disabled{opacity:.6;cursor:wait}
.back-btn{display:block;margin-top:16px;text-align:center;color:#777;text-decoration:none;font-size:12px}
.add-message{display:none;margin-top:15px;padding:10px;border-radius:10px;text-align:center;font-size:12px}
.add-message.success{display:block;background:rgba(70,200,120,.1);color:#78df9d}
.add-message.error{display:block;background:rgba(255,70,70,.1);color:#ff8888}
</style>
</head>
<body>
<div class="add-card">
<h1>Add Song</h1>
<p class="subtitle">Add music to your playlist</p>

<label>Song Title</label>
<input type="text" id="newSongTitle" placeholder="Enter song name" autocomplete="off">

<label>Artist</label>
<input type="text" id="newSongArtist" placeholder="Enter artist name" autocomplete="off">

<label>Audio File</label>
<input type="file" id="newSongAudio" accept="audio/*">

<label>Cover Image</label>
<input type="file" id="newSongCover" accept="image/*">

<img id="coverPreview" class="preview" alt="Cover Preview">

<button id="saveSongBtn" class="add-btn" type="button">＋ Add Song</button>

<div id="addMessage" class="add-message"></div>

<a href="index.html" class="back-btn">← Back to Music</a>
</div>

<script src="add-song.js"></script>
</body>
</html>
