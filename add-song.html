<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Music</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;

            background: #0b0b0d;

            color: white;

            font-family: Arial, sans-serif;
        }

        .add-card {

            width: 100%;
            max-width: 520px;

            padding: 30px;

            border-radius: 24px;

            background: #19191d;

            border: 1px solid
                rgba(255,255,255,0.08);

            box-shadow:
                0 25px 70px
                rgba(0,0,0,0.55);
        }

        h1 {

            margin: 0;

            text-align: center;

            font-size: 27px;
        }

        .subtitle {

            margin:
                8px 0 28px;

            text-align: center;

            color: #777;

            font-size: 13px;
        }

        label {

            display: block;

            margin:
                16px 0 8px;

            color: #aaa;

            font-size: 13px;
        }

        input[type="text"],
        input[type="file"] {

            width: 100%;

            padding: 13px;

            border-radius: 12px;

            border:
                1px solid
                rgba(255,255,255,0.08);

            background:
                rgba(255,255,255,0.05);

            color: white;

            outline: none;
        }

        input[type="file"] {

            cursor: pointer;
        }

        .selected-count {

            margin-top: 10px;

            color: #888;

            font-size: 12px;
        }

        .song-list {

            max-height: 220px;

            overflow-y: auto;

            margin-top: 15px;

            padding: 5px;
        }

        .song-item {

            display: flex;

            align-items: center;

            gap: 10px;

            padding: 9px 10px;

            margin-bottom: 6px;

            border-radius: 10px;

            background:
                rgba(255,255,255,0.04);

            color: #ccc;

            font-size: 12px;
        }

        .song-number {

            width: 25px;

            color: #777;
        }

        .song-name {

            overflow: hidden;

            white-space: nowrap;

            text-overflow: ellipsis;
        }

        .cover-preview {

            width: 90px;
            height: 90px;

            margin:
                15px auto;

            display: none;

            object-fit: cover;

            border-radius: 14px;
        }

        .add-btn {

            width: 100%;

            margin-top: 25px;

            padding: 14px;

            border: none;

            border-radius: 13px;

            background: white;

            color: #111;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;
        }

        .add-btn:disabled {

            opacity: 0.5;

            cursor: wait;
        }

        .progress {

            display: none;

            margin-top: 18px;
        }

        .progress-text {

            margin-bottom: 8px;

            text-align: center;

            color: #aaa;

            font-size: 12px;
        }

        .progress-bar {

            width: 100%;

            height: 6px;

            overflow: hidden;

            border-radius: 10px;

            background: #29292d;
        }

        .progress-fill {

            width: 0%;

            height: 100%;

            background: white;

            transition:
                width 0.2s ease;
        }

        .message {

            display: none;

            margin-top: 15px;

            padding: 11px;

            border-radius: 10px;

            text-align: center;

            font-size: 12px;
        }

        .success {

            display: block;

            color: #78df9d;

            background:
                rgba(70,200,120,0.1);
        }

        .error {

            display: block;

            color: #ff8888;

            background:
                rgba(255,70,70,0.1);
        }

        .back-btn {

            display: block;

            margin-top: 18px;

            text-align: center;

            color: #777;

            text-decoration: none;

            font-size: 12px;
        }

        .back-btn:hover {

            color: white;
        }

    </style>

</head>


<body>


<div class="add-card">

    <h1>
        Add Music
    </h1>

    <p class="subtitle">
        Add multiple songs to your playlist
    </p>


    <label>
        Artist
    </label>

    <input
        type="text"
        id="artistInput"
        placeholder="Enter artist name"
    >


    <label>
        Audio Files
    </label>

    <input
        type="file"
        id="audioInput"
        accept="audio/*"
        multiple
    >


    <div
        id="selectedCount"
        class="selected-count"
    >
        No songs selected
    </div>


    <div
        id="songList"
        class="song-list"
    ></div>


    <label>
        Common Cover Image
        (Optional)
    </label>

    <input
        type="file"
        id="coverInput"
        accept="image/*"
    >


    <img
        id="coverPreview"
        class="cover-preview"
        alt="Cover"
    >


    <button
        id="addSongsBtn"
        class="add-btn"
        type="button"
    >
        ＋ Add All Songs
    </button>


    <div
        id="progress"
        class="progress"
    >

        <div
            id="progressText"
            class="progress-text"
        >
            Preparing...
        </div>

        <div
            class="progress-bar"
        >

            <div
                id="progressFill"
                class="progress-fill"
            ></div>

        </div>

    </div>


    <div
        id="message"
        class="message"
    ></div>


    <a
        href="index.html"
        class="back-btn"
    >
        ← Back to Music
    </a>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="add-song.js"></script>

</body>

</html>
